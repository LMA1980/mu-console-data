[package]
name = "mu-console-data"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/LMA1980/mu-console-data"
authors = ["LMA1980"]
description = "MuConsole data module (dedicated Web Worker WASM): fetch + SSE client, normalized store, diffing, <=10 Hz coalescing, offline snapshot and fixture scenario player"
license = "AGPL-3.0-only"

[[bin]]
name = "mu-console-data"
path = "src/main.rs"

[dependencies]
mu-console-protocol = { version = "0.1.0", git = "https://github.com/LMA1980/mu-console-protocol.git" }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = "1"

[dev-dependencies]
postcard = { version = "1", default-features = false, features = ["alloc"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "AbortController",
    "AbortSignal",
    "Cache",
    "CacheStorage",
    "DedicatedWorkerGlobalScope",
    "Headers",
    "MessageEvent",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "Request",
    "RequestCache",
    "RequestCredentials",
    "RequestInit",
    "Response",
    "WorkerGlobalScope",
] }
